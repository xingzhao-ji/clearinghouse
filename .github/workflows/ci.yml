name: clearinghouse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: ./scripts/services.sh up
      - run: go vet ./...
      - run: make test
        env:
          DATABASE_URL: postgres://postgres:localdemo@127.0.0.1:55432/clearinghouse?sslmode=disable
          NATS_URL: nats://127.0.0.1:54222
      - run: DEMO_BROKER_OUTAGE=1 make demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clearinghouse-evidence
          path: evidence/
